name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up locked project tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.6
          cache: true
          bootstrap: true
          bootstrap_skip: repos
          bootstrap_args: --yes

      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv lock --check
          uv run --locked --no-dev python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"release tag is not stable SemVer: {tag}")
          version = tag.removeprefix("v")

          with Path("pyproject.toml").open("rb") as pyproject_file:
              project_version = tomllib.load(pyproject_file)["project"]["version"]

          rendered_config = subprocess.run(
              ["pixi", "run", "--environment", "dev", "nextflow", "config", "-flat"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          manifest_match = re.search(
              r"(?m)^manifest\.version\s*=\s*['\"]([^'\"]+)['\"]$",
              rendered_config,
          )
          if manifest_match is None:
              raise SystemExit("nextflow.config does not render manifest.version")

          versions = {
              "tag": version,
              "pyproject.toml": project_version,
              "nextflow.config": manifest_match.group(1),
          }
          if len(set(versions.values())) != 1:
              details = "\n".join(f"{source}: {value}" for source, value in versions.items())
              raise SystemExit(f"release versions disagree:\n{details}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output_file:
              output_file.write(f"tag={tag}\n")
              output_file.write(f"version={version}\n")
          PY

      - name: Run release checks
        run: mise run check

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish multi-platform monoimage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nrminor/silly-fast-bfx:${{ steps.release.outputs.version }}
            nrminor/silly-fast-bfx:latest
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=silly-fast-bfx-monoimage
          cache-to: type=gha,mode=max,scope=silly-fast-bfx-monoimage
          provenance: true
          sbom: true

      - name: Build source archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git archive \
            --format=tar.gz \
            --prefix="silly-fast-bfx-${VERSION}/" \
            --output="silly-fast-bfx-${VERSION}.tar.gz" \
            "${GITHUB_SHA}"
          sha256sum "silly-fast-bfx-${VERSION}.tar.gz" > "silly-fast-bfx-${VERSION}.tar.gz.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: nrminor/silly-fast-bfx ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: |
            silly-fast-bfx-${{ steps.release.outputs.version }}.tar.gz
            silly-fast-bfx-${{ steps.release.outputs.version }}.tar.gz.sha256
