[project]
name = "silly-fast-bfx"
version = "0.1.0.dev0"
description = "Extremely fast metagenomics"
requires-python = ">=3.12,<3.13"
dependencies = [
  "biopython==1.87",
  "polars==1.43.2",
  "pysam==0.23.3",
]

[dependency-groups]
dev = [
  "nf-core==4.1.0",
  "ruff==0.16.9",
  "ty==0.0.84",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # These conflict with Ruff's formatter.
  "COM812",
  "ISC001",
  # Keep the PEP 257 default styles from each incompatible pair.
  "D203",
  "D213",
  # The project has not established a copyright owner or notice policy.
  "CPY001",
]

[tool.ty.environment]
python-version = "3.12"

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
requires-pixi = ">=0.77.1,<0.78"

[tool.pixi.dependencies]
python = "3.12.*"
sylph-tax = "==1.9.1"
sracha = "==0.5.0"
minimap2 = "==2.30"
samtools = "==1.22.1"
alignoth = "==1.11.0"
krona = "==2.8.1"

[tool.pixi.feature.dev.dependencies]
nextflow = "==26.04.6"
nf-test = "==0.9.5"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
