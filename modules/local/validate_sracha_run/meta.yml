# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "validate_sracha_run"
description: Confirm that Sracha can resolve one schema-validated SRA run accession.
keywords:
  - sra
  - sracha
  - validation
tools:
  - sracha:
      description: Download sequencing reads from the Sequence Read Archive.
      homepage: https://github.com/rnabioco/sracha-rs
input:
  - meta:
      type: map
      description: Sample metadata retained unchanged in the output tuple.
  - accession:
      type: string
      description: Schema-validated SRA run accession.
output:
  - runs:
      type: string
      description: Tuple of unchanged sample metadata and resolvable SRA run accession.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
