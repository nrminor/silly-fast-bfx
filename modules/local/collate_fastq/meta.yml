# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "collate_fastq"
description: Validate and byte-concatenate one grouped local FASTQ input.
keywords:
  - fastq
  - reads
  - lanes
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
input:
  - meta:
      type: map
      description: Input read-set metadata.
  - reads:
      type: file
      description: Grouped R1 paths followed by grouped R2 paths when paired.
  - r1_count:
      type: integer
      description: Number of R1 paths at the start of the staged read collection.
  - r1_sources:
      type: list
      description: Sorted R1 source paths retained as a role-sensitive task-cache key.
output:
  - reads:
      type: file
      description: Metadata and one or two collated FASTQ paths.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
