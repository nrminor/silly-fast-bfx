# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "prepare_mapping_identities"
description: Validate mapper-visible read names using metadata-only streaming passes.
keywords:
  - fastq
  - mapping
  - identity
input:
  - meta:
      type: map
      description: Metadata for the selected mapping read set.
  - reads:
      type: file
      description: Original FASTQ files for the selected mapping read set.
output:
  - identities:
      type: file
      description: Tuple of read-set metadata, ordered collision substitutions, total record count, and HAS_READS.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
