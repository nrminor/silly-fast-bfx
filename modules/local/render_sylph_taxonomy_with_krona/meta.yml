# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "render_sylph_taxonomy_with_krona"
description: Convert cumulative canonical sylph-tax ranks into a standalone sample/read-set Krona chart.
keywords:
  - sylph
  - taxonomy
  - krona
tools:
  - krona:
      description: Interactive taxonomy chart renderer.
      homepage: https://github.com/marbl/Krona
input:
  - meta:
      type: map
      description: Sample and read-set metadata.
  - reference:
      type: map
      description: Sylph reference specification.
  - taxonomy_profile:
      type: file
      description: sylph-tax cumulative taxonomy output.
output:
  - contributions:
      type: file
      description: Optional non-overlapping canonical-rank abundance contributions for reuse in a comparative chart.
  - charts:
      type: file
      description: Optional self-contained sample/read-set HTML chart.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
