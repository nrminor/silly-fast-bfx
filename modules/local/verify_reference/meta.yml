# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "verify_reference"
description: Record a reference SHA-256 and verify every configured expected digest.
keywords:
  - reference
  - checksum
  - sha256
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
input:
  - location:
      type: string
      description: Normalized absolute local path or exact HTTPS URL used as the acquisition key.
  - logical_basename:
      type: string
      description: Controlled filename retained for staging and provenance.
  - artifact:
      type: file
      description: Acquired reference artifact.
  - expected_sha256s:
      type: list
      description: Distinct expected SHA-256 assertions from every declaration of this location.
output:
  - artifacts:
      type: file
      description: Tuple of location, logical basename, unmodified artifact, and observed.sha256 receipt.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
