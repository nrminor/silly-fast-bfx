# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "verify_reference"
description: Record a reference SHA-256 and verify its configured expected digest.
keywords:
  - reference
  - checksum
  - sha256
tools:
  - python:
      description: Python programming language
      homepage: https://www.python.org/
input:
  - tool:
      type: string
      description: Tool that declared the reference source.
  - reference:
      type: map
      description: Reference specification that declared the source.
  - role:
      type: string
      description: Role of this source within its reference specification.
  - order:
      type: integer
      description: Declaration order within the reference specification.
  - source:
      type: map
      description: Source declaration with local path or HTTPS URL and optional expected SHA-256.
  - artifact:
      type: file
      description: Acquired reference artifact.
output:
  - artifacts:
      type: file
      description: Input context and artifact followed by the observed.sha256 receipt.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
