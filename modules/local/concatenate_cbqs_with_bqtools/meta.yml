# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "concatenate_cbqs_with_bqtools"
description: Concatenate several CBQ read encodings into one CBQ.
keywords:
  - bqtools
  - cbq
  - reads
tools:
  - bqtools:
      description: Toolkit for encoding biological sequence data.
      homepage: https://github.com/ArcInstitute/bqtools
input:
  - meta:
      type: map
      description: Read-set metadata, retained unchanged in the output tuple.
  - cbqs:
      type: file
      description: Two or more CBQ read encodings from one read set.
output:
  - encodings:
      type: file
      description: Tuple of unchanged metadata and one concatenated CBQ read encoding.
  - versions:
      type: file
      description: Software versions topic.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
