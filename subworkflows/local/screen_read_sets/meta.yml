# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "screen_read_sets"
description: Filter read sets with Deacon, profile compatible Sylph references, and summarize configured taxonomy.
keywords:
  - reads
  - deacon
  - filtering
components:
  - encode_reads_with_bqtools
  - filter_reads_with_deacon
  - sketch_reads_with_sylph
  - profile_reads_with_sylph
  - summarize_sylph_taxonomy
input:
  - input_reads:
      type: file
      description: Metadata and one or two FASTQ paths for each input read set.
  - deacon_references:
      type: file
      description: Normalized Deacon reference specifications and prepared indexes.
  - sylph_references:
      type: file
      description: Normalized sample-sketch settings, Sylph reference specifications, and prepared databases.
  - sylph_taxonomy:
      type: file
      description: Sylph reference specifications with ordered explicit taxonomy mappings.
output:
  - deacon:
      type: file
      description: Official Deacon FASTQ and summary outputs with meaningful-data flags.
  - filtered_reads:
      type: file
      description: Meaningful Deacon-filtered read sets as standard FASTQ tuples.
  - sylph:
      type: file
      description: Official raw Sylph profiles with meaningful-data flags.
  - sylph_profiles:
      type: file
      description: Meaningful raw Sylph profiles without transient flags.
  - sylph_taxonomy:
      type: file
      description: Rank-aggregated taxonomy profiles for meaningful configured raw Sylph profiles.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
