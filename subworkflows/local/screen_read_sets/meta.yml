# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "screen_read_sets"
description: Filter read sets with Deacon and screen input and meaningful filtered read sets with Sylph and Skope.
keywords:
  - reads
  - deacon
  - filtering
components:
  - encode_reads_with_bqtools
  - filter_reads_with_deacon
  - sketch_reads_with_sylph
  - profile_reads_with_sylph
  - summarize_sylph_taxonomy
  - query_reads_with_skope
input:
  - input_reads:
      type: file
      description: Metadata and one or more ordered FASTQ paths for each input read set.
  - deacon_references:
      type: file
      description: Normalized Deacon reference specifications and prepared indexes.
  - sylph_references:
      type: file
      description: Normalized sample-sketch settings, Sylph reference specifications, and prepared databases.
  - sylph_taxonomy:
      type: file
      description: Sylph reference specifications with ordered explicit taxonomy mappings.
  - skope_references:
      type: file
      description: Normalized Skope reference specifications and prepared query indexes.
output:
  - deacon:
      type: file
      description: Official Deacon FASTQ and summary outputs with meaningful-data flags.
  - filtered_reads:
      type: file
      description: Meaningful Deacon-filtered read sets as standard FASTQ tuples.
  - sylph:
      type: file
      description: Official raw Sylph profiles with meaningful-data flags.
  - sylph_profiles:
      type: file
      description: Meaningful raw Sylph profiles without transient flags.
  - sylph_taxonomy:
      type: file
      description: Rank-aggregated taxonomy profiles for meaningful configured raw Sylph profiles.
  - skope:
      type: file
      description: Skope query results with separate read-set and reference metadata.
authors:
  - "@nrminor"
maintainers:
  - "@nrminor"
