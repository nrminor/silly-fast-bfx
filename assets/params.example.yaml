# yaml-language-server: $schema=../nextflow_schema.json

input: assets/samplesheet.example.csv
results: results

skip_deacon: true
skip_sylph: true
skip_skope: true
deacon:
  references:
    - id: respiratory
      fasta:
        kind: local
        path: /refs/respiratory.fasta
      build:
        kmer_length: 31
        window_size: 15
      filter:
        abs_threshold: 2
        rel_threshold: 0.01

sylph:
  references:
    - id: gtdb-r232
      read_sets:
        input: true
        deacon_filtered: [respiratory]
      database:
        kind: https
        url: https://example.org/gtdb-r232.syldb
      sample_sketch:
        kmer_length: 31
        compression: 200
        no_dedup: false
        fpr: 0.0001
      profile:
        minimum_ani: 95
        min_count_correct: 3
        min_number_kmers: 50
        estimate_unknown: false
        estimate_read_counts: false
        read_seq_id: null
      taxonomy:
        metadata:
          - kind: https
            url: https://example.org/gtdb-r232-taxonomy.tsv.gz

skope:
  references:
    - id: respiratory
      read_sets:
        input: true
        deacon_filtered: [respiratory]
      targets:
        kind: local
        path: /refs/respiratory.fasta
      build:
        kmer_length: 31
        smer_length: 9
      query:
        abundance_thresholds: [10]
        confidence: false
