# yaml-language-server: $schema=../nextflow_schema.json

input: assets/samplesheet.example.csv
results: results

bqtools:
  block_size: 128K

skip_deacon: true
skip_sylph: true
skip_skope: true
skip_mapping: false
deacon:
  references:
    - id: respiratory
      fasta:
        kind: local
        path: /refs/respiratory.fasta
      build:
        kmer_length: 31
        window_size: 15
      filter:
        abs_threshold: 2
        rel_threshold: 0.01

sylph:
  references:
    - id: gtdb-r232
      read_sets:
        deacon_filtered: [respiratory]
      database:
        kind: https
        url: https://example.org/gtdb-r232.syldb
      sample_sketch:
        kmer_length: 31
        compression: 200
        no_dedup: false
      profile:
        minimum_ani: 95
        min_count_correct: 3
        min_reference_kmers: 50
        # min_matching_kmers: 0 # Optional: allow hits with fewer than the default 7 matching k-mers.
        estimate_unknown: false
        estimate_read_counts: false
        read_seq_id: null
      taxonomy:
        metadata:
          - kind: https
            url: https://example.org/gtdb-r232-taxonomy.tsv.gz

skope:
  references:
    - id: respiratory
      read_sets:
        input: true
      targets:
        - kind: local
          path: /refs/respiratory-a.fasta
        - kind: local
          path: /refs/respiratory-b.fasta
      build:
        kmer_length: 31
        smer_length: 9
        all_kmers: false # Set true for a target represented by a collection of k-mers.
        fraction: 1.0
        individual: false # Default; target lists do not support per-record grouping.
      query:
        abundance_thresholds: [10]
        confidence: false

mapping:
  references: []
